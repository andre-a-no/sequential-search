[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sequential-search"
version = "0.0.1"
description = "Sequential statistical decision-making during graph traversal (math layer; binary tests are its degenerate case)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
# The upstream dependency is optional on purpose: contracts and the degenerate
# anchor run without it (ADR-003, corollary 2).
full = ["sequential-analysis>=0.4,<0.5"]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.importlinter]  # documentation of intent; CI gate is tests/test_dependency_rules.py
root_packages = ["sequential_search"]

[[tool.importlinter.contracts]]
name = "upstream is confined to the adapter (ADR-008 D1)"
type = "forbidden"
source_modules = ["sequential_search.graph", "sequential_search.policy", "sequential_search.io", "sequential_search.interpreters"]
forbidden_modules = ["sequential_analysis"]

[[tool.importlinter.contracts]]
name = "the math layer does not know the interpretation layer (ADR-008 D2)"
type = "forbidden"
source_modules = ["sequential_search"]
forbidden_modules = ["sequentialist_core", "sequentialist_visuals"]

[tool.setuptools.packages.find]
where = ["src"]
